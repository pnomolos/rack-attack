[package]
name = "rack_attack_native"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
magnus = { version = "0.8", features = ["rb-sys"] }
rb-sys = { version = "0.9", features = ["stable-api-compiled-fallback"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_magnus = "0.11"
regex = "1"
ipnet = "2"
jsonwebtoken = "9"
base64 = "0.22"
percent-encoding = "2"
glob-match = "0.2"
